<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join the Team | Marquette Services</title>
    <style>
        /* Modern Reset & Typography */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
        }

        /* Navigation Header */
        header {
            background-color: #1a365d; 
            color: white;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .logo h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .logo span {
            color: #4fd1c5; 
            font-size: 0.9rem;
            display: block;
            font-weight: 400;
        }

        nav ul {
            display: flex;
            list-style: none;
        }

        nav ul li {
            margin-left: 20px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav ul li a:hover, nav ul li a.active {
            color: #4fd1c5;
        }

        /* Hero Sub-Section */
        .hero {
            background: linear-gradient(135deg, #1a365d 0%, #2a4365 100%);
            color: white;
            padding: 3rem 5%;
            text-align: center;
        }

        .hero h2 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }

        /* Form Container Layout */
        .form-container {
            padding: 4rem 5%;
            max-width: 700px;
            margin: 0 auto;
        }

        .application-card {
            background: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

        .application-card h3 {
            color: #1a365d;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .application-card .subtitle {
            color: #718096;
            margin-bottom: 2.5rem;
            font-size: 1rem;
        }

        /* Form Styling Elements */
        .form-group {
            margin-bottom: 1.8rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="tel"],
        .form-group input[type="number"],
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 1rem;
            background-color: #fff;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #4fd1c5;
            box-shadow: 0 0 0 3px rgba(79, 209, 197, 0.2);
        }

        /* Weekday Checkbox Grid */
        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            background-color: #edf2f7;
            padding: 1rem;
            border-radius: 8px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            color: #4a5568;
        }

        .checkbox-item input {
            width: 16px;
            height: 16px;
            accent-color: #1a365d;
            cursor: pointer;
        }

        /* Action Buttons */
        .btn-submit {
            background-color: #1a365d;
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s, transform 0.2s;
            margin-top: 1rem;
        }

        .btn-submit:hover {
            background-color: #2b6cb0;
            transform: translateY(-1px);
        }

        /* Footer (Kept identical) */
        footer {
            background-color: #1a365d;
            color: #a0aec0;
            text-align: center;
            padding: 2rem 5%;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- Header & Page Navigation -->
    <header>
        <div class="logo">
            <h1>Marquette Services</h1>
            <span>Student-Run & Community Driven</span>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="#" class="active">Join Our Team</a></li>
            </ul>
        </nav>
    </header>

    <!-- Subpage Introduction Banner -->
    <section class="hero">
        <h2>Operations Recruitment</h2>
    </section>

    <!-- Form Section -->
    <div class="form-container">
        <div class="application-card">
            <h3>Worker Application Form</h3>
            <p class="subtitle">Complete the fields below to apply for our independent student task network.</p>
            
            <form onsubmit="event.preventDefault(); alert('Application submitted successfully! Our administrative team will review your parameters shortly.');">
                
                <!-- Contact Information Block -->
                <div class="form-group">
                    <label for="full-name">Full Name</label>
                    <input type="text" id="full-name" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="(555) 000-0000" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="johndoe@example.com" required>
                </div>

                <!-- Scheduling Availability Block -->
                <div class="form-group">
                    <label>Weekly Availability (Select all operational days)</label>
                    <div class="checkbox-grid">
                        <label class="checkbox-item"><input type="checkbox" name="availability" value="Monday"> Monday</label>
                        <label class="checkbox-item"><input type="checkbox" name="availability" value="Tuesday"> Tuesday</label>
                        <label class="checkbox-item"><input type="checkbox" name="availability" value="Wednesday"> Wednesday</label>
                        <label class="checkbox-item"><input type="checkbox" name="availability" value="Thursday"> Thursday</label>
                        <label class="checkbox-item"><input type="checkbox" name="availability" value="Friday"> Friday</label>
                        <label class="checkbox-item"><input type="checkbox" name="availability" value="Saturday"> Saturday</label>
                        <label class="checkbox-item"><input type="checkbox" name="availability" value="Sunday"> Sunday</label>
                    </div>
                </div>

                <!-- Capacity Metric -->
                <div class="form-group">
                    <label for="capacity">Weekly Capacity Constraint</label>
                    <input type="number" id="capacity" min="1" max="25" placeholder="Maximum number of yards you can manage per week" required>
                </div>

                <!-- Logistics / Equipment Tracking -->
                <div class="form-group">
                    <label for="logistics">Equipment & Logistics Profile</label>
                    <textarea id="logistics" rows="4" placeholder="Please list the equipment or tools you own (e.g., lawnmower, trimmer, basic tools) and specify your primary mode of transportation." required></textarea>
                </div>

                <!-- Submission Action -->
                <button type="submit" class="btn-submit">Submit Registration Details</button>

            </form>
        </div>
    </div>

    <!-- Footer Status -->
    <footer>
        <p>&copy; 2026 Marquette Services. Built professionally by students.</p>
    </footer>

</body>
</html>
